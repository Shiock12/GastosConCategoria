<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>

<body>
    <div class="title-page">
        <h1>Aplicacion para gastos personales</h1>
    </div>

    <div class="input-gastos">
        <label for="">Ingresa tu gasto</label>
        <input type="number" placeholder="Monto" id="monto">
    </div>
    <div class="form-opciones">
        <form action="">
            <label for="">Selecciona el rubro</label>
            <select name="" id="categoria">
                <option value="carniceria">Carniceria</option>
                <option value="verduleria">Verduleria</option>
                <option value="supermercado">Supermercado</option>
                <option value="casa">Gastos casa</option>
            </select>
        </form>
        <button id="button">Aceptar</button>
    </div>

    <div class="categorias">
        <h2 id="carniceria">Carniceria</h2>
        <ul id="ul-carniceria">
        </ul>
        <p id="gastoCarniceria"></p>

        <h2 id="verduleria">Verduleria</h2>
        <ul id="ul-verduleria">
        </ul>
        <p id="gastoVerduleria"></p>

        <h2 id="supermercado">Supermercado</h2>
        <ul id="ul-supermercado">
        </ul>
        <p id="gastoSupermercado"></p>

        <h2 id="casa">Casa</h2>
        <ul id="ul-casa">
        </ul>
        <p id="gastoCasa"></p>
    </div>

    <script src="../funcionalides/index.js"></script>
</body>
</html>
